[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monster-game"
version = "0.1.0"
description = "Pure game-logic port of a Monster Hunter style chat-bot plugin."
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["monster_game"]

[tool.setuptools.package-dir]
monster_game = "."

[tool.setuptools.package-data]
monster_game = ["data/*.json"]
